<!<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gest�o de Documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css">
</head>
<body>
    <h1>Gestão de Documentos</h1>

    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do Cliente">
        <input type="file" id="arquivo">
        <button id="btEnviar" onclick="enviarDocumento()">Enviar</button>
    </div>

    <script src="documento.js"></script>

    <div class="container">
        <h2>Gerenciamento de Documentos - Banco Senai</h2>

        <form id="formUpload">
            <input type="text" id="clientIdUpload" placeholder="Código do Cliente" required />
            <input type="file" id="fileInput" required />
            <button type="submit">Enviar</button>
        </form>

        <hr>

        <div class="busca-container">
            <input type="text" id="searchClientId" placeholder="Digitar Código do Cliente" />
            <button id="btnBuscar">Buscar Documentos</button>
        </div>

        
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Extensão</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaDocumentos">
            </tbody>
        </table>
    </div>

</body>
</html>
